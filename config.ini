[database]
url = sqlite:///communication_engine.db
echo = false

[transcription]
provider = openai_whisper
model = whisper-1
language = en
timeout = 2000

[llm]
provider = openai
model = gpt-4-turbo-preview
temperature = 0.5
max_tokens = 500

[websocket]
host = 0.0.0.0
port = 8000
max_connections = 100

[twilio]
account_sid = YOUR_TWILIO_ACCOUNT_SID
auth_token = YOUR_TWILIO_AUTH_TOKEN
webhook_url = /api/twilio/webhook

[vonage]
api_key = YOUR_VONAGE_API_KEY
api_secret = YOUR_VONAGE_API_SECRET
webhook_url = /api/vonage/webhook

[logging]
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

[performance]
transcription_timeout_ms = 2000
intent_analysis_timeout_ms = 1500
max_concurrent_streams = 50
task_priority_levels = 5

[notifications]
service = firebase
api_key = YOUR_NOTIFICATION_SERVICE_KEY

[pms_integration]
system = opera
base_url = https://pms.hotel.local/api
timeout = 5000
auth_type = oauth2
