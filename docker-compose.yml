version: '3.9'

services:
  # ==================== PostgreSQL Database ====================
  postgres:
    image: postgres:16-alpine
    container_name: ai_engine_postgres
    environment:
      POSTGRES_USER: engine_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-engine_secure_pass}
      POSTGRES_DB: communication_engine
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine_user -d communication_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

  # ==================== Redis Cache ====================
  redis:
    image: redis:7-alpine
    container_name: ai_engine_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

  # ==================== AI Communication Engine ====================
  ai_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_engine_app
    environment:
      # Database
      DATABASE_URL: "postgresql://engine_user:${DB_PASSWORD:-engine_secure_pass}@postgres:5432/communication_engine"
      
      # API Keys & Credentials
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      
      VONAGE_API_KEY: ${VONAGE_API_KEY:-}
      VONAGE_API_SECRET: ${VONAGE_API_SECRET:-}
      
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      
      # Redis
      REDIS_URL: "redis://redis:6379/0"
      
      # Application Settings
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      
      # Performance
      MAX_WORKERS: 4
      MAX_CONCURRENT_STREAMS: 50
      TIMEOUT_MS: 30000
    
    ports:
      - "${APP_PORT:-8000}:8000"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    volumes:
      - ./config.ini:/app/config.ini:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ${FIREBASE_CREDENTIALS_PATH:-.}:${FIREBASE_CREDENTIALS_PATH:-/tmp}:ro
    
    networks:
      - app_network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== Nginx Reverse Proxy ====================
  nginx:
    image: nginx:alpine
    container_name: ai_engine_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - ai_engine
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Prometheus Monitoring (Optional) ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: ai_engine_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app_network
    restart: unless-stopped
    profiles:
      - monitoring

  # ==================== Grafana Dashboards (Optional) ====================
  grafana:
    image: grafana/grafana:latest
    container_name: ai_engine_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: "redis-datasource"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network
    restart: unless-stopped
    profiles:
      - monitoring

# ==================== Volumes ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==================== Networks ====================
networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==================== Deployment Instructions ====================
# 
# 1. Create .env file and set environment variables:
#    cp .env.example .env
#    # Edit .env with your values
#
# 2. Build and start all services:
#    docker-compose up -d
#
# 3. Check service status:
#    docker-compose ps
#
# 4. View logs:
#    docker-compose logs -f ai_engine
#
# 5. Scale workers:
#    docker-compose up -d --scale ai_engine=3
#
# 6. Stop all services:
#    docker-compose down
#
# 7. Remove all data and volumes:
#    docker-compose down -v
#
# 8. With monitoring (Prometheus + Grafana):
#    docker-compose --profile monitoring up -d
#
# 9. Access endpoints:
#    - Application API: http://localhost:8000
#    - API Docs: http://localhost:8000/docs
#    - Nginx Proxy: http://localhost
#    - Grafana: http://localhost:3000
#    - Prometheus: http://localhost:9090
#
