<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Communication Engine — MVP Notifications</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      #log { border: 1px solid #ddd; padding: 10px; height: 300px; overflow:auto; }
      .item { padding:6px; border-bottom:1px solid #eee }
    </style>
  </head>
  <body>
    <h3>MVP Notifications (Live)</h3>
    <div id="log"></div>

    <h3>History</h3>
    <div id="history" style="border:1px solid #ddd;padding:10px;height:200px;overflow:auto"></div>

    <h4>Send Demo Notification</h4>
    <form id="notifyForm">
      <input id="text" placeholder='{"id":"t1","description":"Test"}' style="width:60%" />
      <button type="submit">Send</button>
    </form>

    <script>
      const log = document.getElementById('log');

      const es = new EventSource('/mvp/stream');
      es.onmessage = (evt) => {
        const obj = JSON.parse(evt.data);
        const el = document.createElement('div');
        el.className = 'item';
        el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + JSON.stringify(obj);
        log.prepend(el);
      };

      document.getElementById('notifyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        let value = document.getElementById('text').value || '{}';
        let payload;
        try { payload = JSON.parse(value); } catch (err) { alert('Invalid JSON'); return; }
        await fetch('/mvp/notify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        document.getElementById('text').value = '';
      });

      async function loadHistory(){
        try{
          const r = await fetch('/mvp/history');
          const j = await r.json();
          const hist = document.getElementById('history');
          hist.innerHTML = '';
          j.items.forEach(it => {
            const el = document.createElement('div');
            el.className = 'item';
            el.textContent = '[' + new Date(it.created_at).toLocaleString() + '] ' + JSON.stringify(it.payload);
            hist.appendChild(el);
          });
        }catch(e){ console.error(e) }
      }

      // load history on open
      loadHistory();

      // refresh periodically
      setInterval(loadHistory, 5000);
    </script>
  </body>
</html>
