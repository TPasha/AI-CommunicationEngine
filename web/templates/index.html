<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Command Center - 5-Star Dispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.esm.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-gold: #D4AF37;
            --color-gold-light: #F3E5AB;
            --color-gold-dark: #996515;
            --color-obsidian: #0B0C10;
            --color-charcoal: #1F2833;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-obsidian);
            color: #E0E2E4;
            margin: 0;
            overflow: hidden;
        }

        h1, h2, h3, h4, .font-playfair {
            font-family: var(--font-heading);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.6);
        }

        .gold-gradient-text {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .glass-panel {
            background: rgba(31, 40, 51, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-panel-gold {
            background: rgba(31, 40, 51, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 8px 32px 0 rgba(212, 175, 55, 0.15);
        }

        .pulse-gold {
            animation: pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-gold {
            0%, 100% {
                opacity: 0.8;
                box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 30px rgba(212, 175, 55, 0.7);
            }
        }

        .pulse-red {
            animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-red {
            0%, 100% {
                opacity: 0.8;
                box-shadow: 0 0 15px rgba(220, 38, 38, 0.3);
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 30px rgba(220, 38, 38, 0.7);
            }
        }

        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 30px;
        }

        .waveform-bar {
            width: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            animation: wave-idle 0.6s ease-in-out infinite;
        }

        .waveform-bar:nth-child(1) { animation-delay: -0.36s; }
        .waveform-bar:nth-child(2) { animation-delay: -0.24s; }
        .waveform-bar:nth-child(3) { animation-delay: -0.12s; }

        .waveform.active .waveform-bar {
            background: var(--color-gold);
            animation: wave-active 0.6s ease-in-out infinite;
        }

        @keyframes wave-idle {
            0%, 100% { height: 6px; }
            50% { height: 10px; }
        }

        @keyframes wave-active {
            0%, 100% { height: 8px; }
            25% { height: 20px; }
            50% { height: 28px; }
            75% { height: 20px; }
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--color-gold);
            animation: blink 1s infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .card-priority-high {
            border-left: 4px solid #ef4444;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.05) 0%, rgba(31, 40, 51, 0.6) 100%);
        }

        .card-priority-normal {
            border-left: 4px solid var(--color-gold);
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.05) 0%, rgba(31, 40, 51, 0.6) 100%);
        }

        .card-priority-review {
            border: 1px solid var(--color-gold);
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1);
            animation: pulse-review 2s ease-in-out infinite;
        }

        @keyframes pulse-review {
            0%, 100% { border-color: rgba(212, 175, 55, 0.4); }
            50% { border-color: rgba(212, 175, 55, 1); box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* Audio Player Styling */
        .custom-audio-player {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
    </style>
</head>

<body>
    <div id="root" class="w-full h-screen flex flex-col">
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: #D4AF37;">
            <p class="font-playfair text-2xl italic tracking-widest">Loading Grand Command Center...</p>
        </div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        // Voice Recording Component
        function VoiceRecorder({ onTaskCreated }) {
            const [isRecording, setIsRecording] = React.useState(false);
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [recordingTime, setRecordingTime] = React.useState(0);
            const mediaRecorderRef = React.useRef(null);
            const streamRef = React.useRef(null);
            const chunksRef = React.useRef([]);
            const recordStartRef = React.useRef(null);
            const timerRef = React.useRef(null);

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    streamRef.current = stream;

                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;
                    chunksRef.current = [];
                    recordStartRef.current = Date.now();
                    setRecordingTime(0);

                    mediaRecorder.ondataavailable = (event) => {
                        chunksRef.current.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        clearInterval(timerRef.current);
                        const audioBlob = new Blob(chunksRef.current, { type: 'audio/wav' });
                        await submitAudio(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    setIsRecording(true);

                    timerRef.current = setInterval(() => {
                        setRecordingTime(Math.round((Date.now() - recordStartRef.current) / 1000));
                    }, 100);
                } catch (error) {
                    console.error('Error accessing microphone:', error);
                    alert('Could not access microphone. Please check permissions.');
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const submitAudio = async (audioBlob) => {
                setIsProcessing(true);
                try {
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'audio.wav');
                    formData.append('speaker_id', 'Manager');

                    const response = await fetch('/mvp/voice', {
                        method: 'POST',
                        body: formData,
                    });

                    const result = await response.json();
                    if (result.task) {
                        onTaskCreated(result);
                    } else if (result.status === 'error') {
                        alert('Error: ' + result.message);
                    }
                } catch (error) {
                    console.error('Error processing audio:', error);
                    alert('Error processing audio: ' + error.message);
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div className="fixed bottom-8 right-8 z-40">
                    {isRecording ? (
                        <button
                            onClick={stopRecording}
                            disabled={isProcessing}
                            className="px-6 py-3 bg-red-900/80 hover:bg-red-800 border border-red-500 text-white font-medium rounded-full pulse-red flex items-center gap-3 shadow-2xl backdrop-blur-sm transition-all"
                        >
                            <div className="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
                            STOP RECORDING <span className="font-mono text-sm ml-2">00:{recordingTime.toString().padStart(2, '0')}</span>
                        </button>
                    ) : (
                        <button
                            onClick={startRecording}
                            disabled={isProcessing}
                            className="px-8 py-3 bg-[#1A1A1A]/80 hover:bg-[#2A2A2A] border border-[#D4AF37]/50 text-[#D4AF37] font-medium rounded-full shadow-2xl backdrop-blur-sm flex items-center gap-3 transition-all hover:border-[#D4AF37] group"
                        >
                            <svg className="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            {isProcessing ? 'ANALYZING...' : 'DISPATCH REQUEST'}
                        </button>
                    )}
                </div>
            );
        }

        // Header Component
        function Header({ isTransmitting, totalOrders }) {
            return (
                <header className="glass-panel border-b-0 border-t-0 border-l-0 border-r-0 border-b-[#D4AF37]/30 px-8 py-5 flex items-center justify-between relative z-10">
                    <div className="flex items-center gap-6">
                        <div className="w-10 h-10 rounded-full border border-[#D4AF37] flex items-center justify-center bg-[#D4AF37]/10">
                            <svg className="w-5 h-5 text-[#D4AF37]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.5l7 14.5H5l7-14.5z"/></svg>
                        </div>
                        <div>
                            <h1 className="text-2xl font-playfair font-bold gold-gradient-text tracking-wide">GRAND COMMAND</h1>
                            <p className="text-xs text-[#8BA0B0] font-medium tracking-[0.2em] uppercase mt-1">Operational Intelligence</p>
                        </div>
                    </div>
                    
                    <div className="flex items-center gap-8">
                        <div className="flex items-center gap-4 bg-[#1F2833]/50 px-5 py-2 rounded-full border border-[#D4AF37]/20">
                            <div className={`waveform ${isTransmitting ? 'active' : ''}`}>
                                {[1, 2, 3].map(i => <div key={i} className="waveform-bar"></div>)}
                            </div>
                            <span className={`text-xs font-semibold tracking-widest uppercase ${isTransmitting ? 'text-[#D4AF37]' : 'text-[#8BA0B0]'}`}>
                                {isTransmitting ? 'Intercepting' : 'Monitoring'}
                            </span>
                        </div>
                        <div className="text-right">
                            <div className="text-[10px] font-bold text-[#8BA0B0] tracking-[0.15em] uppercase">Active Dispatches</div>
                            <div className="text-3xl font-playfair text-[#D4AF37] leading-none mt-1">{totalOrders}</div>
                        </div>
                    </div>
                </header>
            );
        }

        // Live Feed Component
        function LiveFeed({ transmissions, isTransmitting }) {
            const feedRef = React.useRef(null);
            React.useEffect(() => {
                if (feedRef.current) {
                    feedRef.current.scrollTop = 0;
                }
            }, [transmissions]);

            return (
                <div className="h-full flex flex-col border-r border-[#D4AF37]/20 bg-[#0B0C10]/80">
                    <div className="px-6 py-4 border-b border-[#D4AF37]/10 flex items-center justify-between">
                        <h2 className="text-sm font-semibold text-[#D4AF37] tracking-[0.15em] uppercase flex items-center gap-2">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            Live Intercepts
                        </h2>
                    </div>
                    <div ref={feedRef} className="flex-1 overflow-y-auto space-y-4 p-6 custom-scrollbar">
                        {transmissions.length === 0 ? (
                            <div className="text-center text-[#8BA0B0]/50 text-xs tracking-wider uppercase mt-10">
                                Awaiting communications...
                            </div>
                        ) : (
                            transmissions.map((t, idx) => (
                                <div key={idx} className="fade-in border-l border-[#D4AF37]/30 pl-4 py-1 relative">
                                    <div className="absolute -left-[5px] top-2 w-2 h-2 rounded-full bg-[#D4AF37]/50"></div>
                                    <div className="flex justify-between items-baseline mb-1">
                                        <span className="text-[10px] text-[#8BA0B0] tracking-widest">{new Date(t.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>
                                    </div>
                                    <div className="text-sm text-[#E0E2E4] font-light italic leading-relaxed">
                                        "{t.text}"{t.isTyping && <span className="typing-cursor"></span>}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }
        
        // Simple Audio Player Component
        function AudioPlayer({ url }) {
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [duration, setDuration] = React.useState(0);
            const [currentTime, setCurrentTime] = React.useState(0);
            const audioRef = React.useRef(null);
            
            React.useEffect(() => {
                const audio = new Audio(url);
                audioRef.current = audio;
                
                audio.addEventListener('loadedmetadata', () => setDuration(audio.duration));
                audio.addEventListener('timeupdate', () => setCurrentTime(audio.currentTime));
                audio.addEventListener('ended', () => setIsPlaying(false));
                
                return () => {
                    audio.pause();
                    audio.src = '';
                };
            }, [url]);
            
            const togglePlay = (e) => {
                e.stopPropagation();
                if (isPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play();
                }
                setIsPlaying(!isPlaying);
            };
            
            return (
                <div className="custom-audio-player" onClick={(e) => e.stopPropagation()}>
                    <button onClick={togglePlay} className="w-6 h-6 rounded-full bg-[#D4AF37]/20 flex items-center justify-center hover:bg-[#D4AF37]/40 transition-colors text-[#D4AF37]">
                        {isPlaying ? (
                            <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd"></path></svg>
                        ) : (
                            <svg className="w-3 h-3 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd"></path></svg>
                        )}
                    </button>
                    <div className="flex-1 h-1 bg-[#1F2833] rounded-full overflow-hidden w-20 cursor-pointer" onClick={(e) => {
                        e.stopPropagation();
                        if (audioRef.current && duration) {
                            const rect = e.currentTarget.getBoundingClientRect();
                            const x = e.clientX - rect.left;
                            audioRef.current.currentTime = (x / rect.width) * duration;
                        }
                    }}>
                        <div className="h-full bg-[#D4AF37]" style={{ width: `${(currentTime / (duration || 1)) * 100}%` }}></div>
                    </div>
                </div>
            );
        }

        // Task Card
        function TaskCard({ task, onReview, onComplete }) {
            const [elapsed, setElapsed] = React.useState(0);
            React.useEffect(() => {
                const start = task.createdAt || Date.now();
                const interval = setInterval(() => setElapsed(Math.floor((Date.now() - start) / 1000)), 1000);
                return () => clearInterval(interval);
            }, [task.createdAt]);

            const formatTime = (secs) => `${Math.floor(secs / 60)}m ${secs % 60}s`;
            
            const isReview = task.requiresReview;
            const priorityClass = isReview ? 'card-priority-review' : 
                                 (task.priority === 'high' ? 'card-priority-high' : 'card-priority-normal');
            
            const teamBadgeColors = {
                'Kitchen': 'bg-amber-900/30 text-amber-400 border-amber-700/50',
                'Housekeeping': 'bg-sky-900/30 text-sky-400 border-sky-700/50',
                'Maintenance': 'bg-stone-800/80 text-stone-300 border-stone-600/50',
                'Front Desk': 'bg-indigo-900/30 text-indigo-400 border-indigo-700/50',
                'Room Service': 'bg-rose-900/30 text-rose-400 border-rose-700/50',
                'Security': 'bg-zinc-900/80 text-zinc-300 border-zinc-600/50'
            };
            
            const teamColor = task.team_category ? (teamBadgeColors[task.team_category] || 'bg-[#D4AF37]/10 text-[#D4AF37] border-[#D4AF37]/30') : 'bg-gray-800 text-gray-300 border-gray-600';

            return (
                <div className={`glass-panel rounded-lg p-5 slide-up ${priorityClass} relative overflow-hidden`}>
                    {/* Top row */}
                    <div className="flex justify-between items-start mb-4">
                        <div className="flex flex-wrap gap-2 items-center">
                            {task.team_category && (
                                <span className={`px-3 py-1 rounded-sm text-[10px] font-bold tracking-widest uppercase border ${teamColor}`}>
                                    {task.team_category}
                                </span>
                            )}
                            {isReview && (
                                <span className="px-3 py-1 rounded-sm text-[10px] font-bold tracking-widest uppercase bg-[#D4AF37]/20 text-[#D4AF37] border border-[#D4AF37]/50 pulse-gold">
                                    Verification Required
                                </span>
                            )}
                            {task.priority === 'high' && !isReview && (
                                <span className="px-3 py-1 rounded-sm text-[10px] font-bold tracking-widest uppercase bg-red-900/30 text-red-400 border border-red-500/30">
                                    Priority
                                </span>
                            )}
                        </div>
                        <div className="text-[10px] text-[#8BA0B0] font-mono tracking-widest">
                            {formatTime(elapsed)}
                        </div>
                    </div>
                    
                    {/* Content */}
                    <p className="text-[15px] font-playfair italic leading-relaxed text-[#F3E5AB] mb-5">
                        "{task.description || task.transcription}"
                    </p>
                    
                    {/* Bottom row */}
                    <div className="flex justify-between items-end border-t border-[rgba(212,175,55,0.1)] pt-4 mt-2">
                        <div className="flex gap-4 text-xs">
                            <div>
                                <span className="block text-[9px] text-[#8BA0B0] uppercase tracking-widest mb-1">Confidence</span>
                                <span className="font-mono text-[#E0E2E4]">{Math.round((task.confidence || 0.85) * 100)}%</span>
                            </div>
                        </div>
                        <div className="flex gap-3 items-center">
                            {task.audio_url && <AudioPlayer url={task.audio_url} />}
                            {isReview && (
                                <button onClick={() => onReview(task)} className="px-4 py-2 bg-[#D4AF37] hover:bg-[#F3E5AB] text-[#0B0C10] text-xs font-bold tracking-wider uppercase rounded-sm transition-colors shadow-lg">
                                    Review
                                </button>
                            )}
                            {!isReview && (
                                <button onClick={() => onComplete && onComplete(task)} className="px-4 py-2 bg-transparent hover:bg-[#D4AF37]/10 text-[#D4AF37] border border-[#D4AF37]/50 text-xs font-bold tracking-wider uppercase rounded-sm transition-colors">
                                    Dispatch
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Review Modal
        function ReviewModal({ task, onClose, onConfirm, onDiscard }) {
            if (!task) return null;
            return (
                <div className="fixed inset-0 bg-[#0B0C10]/90 backdrop-blur-md flex items-center justify-center z-50 fade-in">
                    <div className="glass-panel-gold rounded-xl p-8 max-w-lg w-full mx-4 shadow-2xl slide-up">
                        <h3 className="font-playfair text-2xl text-[#D4AF37] mb-6 border-b border-[#D4AF37]/20 pb-4">Verify Intelligence</h3>
                        
                        <div className="space-y-6">
                            <div>
                                <div className="text-[10px] text-[#8BA0B0] uppercase tracking-[0.2em] mb-2">Intercepted Audio</div>
                                {task.audio_url ? <AudioPlayer url={task.audio_url} /> : <span className="text-xs text-gray-500">Audio unavailable</span>}
                            </div>
                            
                            <div>
                                <div className="text-[10px] text-[#8BA0B0] uppercase tracking-[0.2em] mb-2">Machine Transcription</div>
                                <div className="bg-[#0B0C10]/50 border border-[#D4AF37]/20 p-4 rounded text-[#F3E5AB] font-playfair italic">
                                    "{task.transcription}"
                                </div>
                            </div>
                            
                            <div className="flex gap-8">
                                <div>
                                    <div className="text-[10px] text-[#8BA0B0] uppercase tracking-[0.2em] mb-2">Assigned Division</div>
                                    <div className="text-sm font-semibold text-[#E0E2E4]">{task.team_category || 'General'}</div>
                                </div>
                                <div>
                                    <div className="text-[10px] text-[#8BA0B0] uppercase tracking-[0.2em] mb-2">Confidence</div>
                                    <div className="text-sm font-mono text-[#D4AF37]">{Math.round((task.confidence || 0) * 100)}%</div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex gap-4 mt-8 pt-6 border-t border-[#D4AF37]/20">
                            <button onClick={() => onConfirm(task)} className="flex-1 py-3 bg-[#D4AF37] hover:bg-[#F3E5AB] text-[#0B0C10] font-bold tracking-widest uppercase text-xs rounded transition-colors shadow-lg">
                                Confirm & Dispatch
                            </button>
                            <button onClick={() => onDiscard(task)} className="flex-1 py-3 bg-transparent hover:bg-red-900/30 text-[#8BA0B0] hover:text-red-400 border border-[#8BA0B0]/30 hover:border-red-500/50 font-bold tracking-widest uppercase text-xs rounded transition-colors">
                                Discard
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Main App
        function AICommandCenter() {
            const [tasks, setTasks] = React.useState([]);
            const [transmissions, setTransmissions] = React.useState([]);
            const [isTransmitting, setIsTransmitting] = React.useState(false);
            const [reviewTask, setReviewTask] = React.useState(null);

            const handleVoiceTaskCreated = (result) => {
                const now = Date.now();
                
                // Add to wire feed
                const newTransmission = {
                    text: result.transcription,
                    timestamp: now,
                    isTyping: false
                };
                setTransmissions(prev => [newTransmission, ...prev].slice(0, 50));
                
                // Add to tasks
                if (result.task) {
                    const task = {
                        ...result.task,
                        createdAt: now,
                        requiresReview: result.requires_human_review
                    };
                    setTasks(prev => [task, ...prev].slice(0, 20));
                }
                
                setIsTransmitting(true);
                setTimeout(() => setIsTransmitting(false), 2000);
            };

            const handleConfirmTask = (taskToConfirm) => {
                setTasks(prev => prev.map(t => 
                    t.id === taskToConfirm.id ? { ...t, requiresReview: false } : t
                ));
                setReviewTask(null);
            };

            const handleDiscardTask = (taskToDiscard) => {
                setTasks(prev => prev.filter(t => t.id !== taskToDiscard.id));
                setReviewTask(null);
            };

            const handleCompleteTask = (taskToComplete) => {
                setTasks(prev => prev.filter(t => t.id !== taskToComplete.id));
            };

            const reviewTasks = tasks.filter(t => t.requiresReview);
            const activeTasks = tasks.filter(t => !t.requiresReview);

            return (
                <div className="w-full h-screen flex flex-col relative bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] bg-repeat">
                    {/* Background glow effects */}
                    <div className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-[#D4AF37]/5 blur-[120px] pointer-events-none"></div>
                    <div className="absolute bottom-[-20%] right-[-10%] w-[40%] h-[50%] rounded-full bg-[#D4AF37]/5 blur-[100px] pointer-events-none"></div>

                    <Header isTransmitting={isTransmitting} totalOrders={tasks.length} />

                    <div className="flex flex-1 overflow-hidden relative z-10">
                        {/* Live Feed Sidebar */}
                        <div className="w-1/3 max-w-sm hidden md:block">
                            <LiveFeed transmissions={transmissions} isTransmitting={isTransmitting} />
                        </div>

                        {/* Main Queue area */}
                        <div className="flex-1 flex flex-col p-6 md:p-8 overflow-y-auto custom-scrollbar">
                            <div className="max-w-4xl w-full mx-auto space-y-8">
                                
                                {reviewTasks.length > 0 && (
                                    <section>
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="w-2 h-2 rounded-full bg-[#D4AF37] pulse-gold"></div>
                                            <h2 className="text-xs font-bold text-[#D4AF37] tracking-[0.2em] uppercase">Verification Required ({reviewTasks.length})</h2>
                                        </div>
                                        <div className="grid gap-4">
                                            {reviewTasks.map(t => <TaskCard key={t.id} task={t} onReview={setReviewTask} onComplete={handleCompleteTask} />)}
                                        </div>
                                    </section>
                                )}
                                
                                <section>
                                    <h2 className="text-xs font-bold text-[#8BA0B0] tracking-[0.2em] uppercase mb-4 mt-6">Active Queue</h2>
                                    {activeTasks.length === 0 ? (
                                        <div className="glass-panel rounded-xl p-12 text-center flex flex-col items-center justify-center border-dashed border-[#D4AF37]/20">
                                            <svg className="w-12 h-12 text-[#8BA0B0]/30 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                                            <p className="text-[#8BA0B0] font-light italic">The queue is currently empty.</p>
                                        </div>
                                    ) : (
                                        <div className="grid gap-4">
                                            {activeTasks.map(t => <TaskCard key={t.id} task={t} onReview={setReviewTask} onComplete={handleCompleteTask} />)}
                                        </div>
                                    )}
                                </section>
                            </div>
                        </div>
                    </div>

                    <VoiceRecorder onTaskCreated={handleVoiceTaskCreated} />
                    <ReviewModal 
                        task={reviewTask} 
                        onClose={() => setReviewTask(null)}
                        onConfirm={handleConfirmTask}
                        onDiscard={handleDiscardTask}
                    />
                </div>
            );
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<AICommandCenter />);
        } catch(e) {
            console.error(e);
        }
    </script>
</body>
</html>
